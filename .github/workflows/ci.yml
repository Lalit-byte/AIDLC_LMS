name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix client ci || npm --prefix client install
          npm --prefix server ci || npm --prefix server install

      - name: Lint Code
        run: npm run lint

      - name: Run Tests (Server & Client)
        run: npm test

      - name: Build Frontend
        run: npm run build
